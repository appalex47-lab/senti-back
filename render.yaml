services:
  - type: web
    name: sentia-intelligence-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m python.connection_server
    healthCheckPath: /api/health
    envVars:
      - key: SENTIA_CONNECTOR_HOST
        value: 0.0.0.0
      - key: SENTIA_ALLOWED_ORIGINS
        sync: false
      - key: SENTIA_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL
        value: command-a-plus-05-2026
